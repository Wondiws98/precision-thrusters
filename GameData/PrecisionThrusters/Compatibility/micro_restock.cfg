@PART[micro_monoprop_engine]:FOR[PrecisionThrusters]:NEEDS[Restock]
{
	!MODEL {}
	!MODEL {}
	MODEL
	{
		model = ReStock/Assets/Control/restock-rcs-linear-2
	}
	MODEL //"Steal" the thrustTransform of the ant engine.
	{
		model = ReStock/Assets/Engine/restock-engine-ant-1
		scale = 0, 0, 0
		position = 0, 0.1, 0
		rotation = 180, 0, 0
	}
	!EFFECTS {}
	EFFECTS
	{
		running
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.02 0.2
				volume = 0.5 0.2
				volume = 1.0 0.2
				pitch = 1.0
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				name = fx1
				modelName = ReStock/FX/restock-fx-rcs-1
				transformName = RCSthruster
				emission = 0.0 0.0
				emission = 0.1 0.0
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				//localRotation = -90, 0, 0
			}
			MODEL_MULTI_PARTICLE
			{
				name = fx2
				modelName = ReStock/FX/restock-fx-rcs-1
				transformName = RCSthruster
				emission = 0.0 0.0
				emission = 0.1 0.0
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				//localRotation = -90, 0, 0
				localPosition = 0, -0.015, 0
			}
		}
	}
	MODULE
	{
		name = ModulePartVariants
		baseVariant = Pod
		VARIANT
		{
			name = Pod
			displayName = #LOC_Restock_variant-linear-rcs-pod
			primaryColor = #ffffff
			secondaryColor = #ffffff
			GAMEOBJECTS
			{
				RCSLinear = true
				RCSLinearBase = false
			}
		}
		VARIANT
		{
			name = Bare
			displayName = #LOC_Restock_variant-linear-rcs-bare
			primaryColor = #999999
			secondaryColor = #999999
			GAMEOBJECTS
			{
				RCSLinear = false
				RCSLinearBase = true
			}
		}
	}
	MODULE
	{
		name = ModuleRestockDepthMask
		maskTransform = 1Mask
	}
	MODULE
	{
		name = ModuleRestockDepthMask
		maskTransform = 1MaskShroud
	}
	!MODULE[FXModuleAnimateThrottle] {}
	MODULE
	{
		name = FXModuleThrottleEffects
		fxModuleNames = heatColor
		responseSpeed = 1.0
		dependOnEngineState = True
		dependOnThrottle = True
	}
	MODULE
	{
		name = FXModuleThrottleEffects
		fxModuleNames = throttleColor
		responseSpeed = 1.0
		dependOnEngineState = True
		dependOnThrottle = True
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = heatColor
		animRate = 0.025
		shaderProperty = _EmissiveColor
		excludedRenderer = EngineCore
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
		greenCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
		blueCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
		alphaCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = throttleColor
		animRate = 1
		shaderProperty = _TintColor
		includedRenderer = EngineCore
		toggleInEditor = false
		toggleInFlight = false
		alphaCurve
		{
			key = 0 0
			key = 1 1
		}
		redCurve
		{
			key = 0 1
		}
		greenCurve
		{
			key = 0 1
		}
		blueCurve
		{
			key = 0 1
		}
	}
}